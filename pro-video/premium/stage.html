<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--red:#ef2332;--hot:#ff5a5a;--ink:#050507;--line:rgba(255,255,255,.14);--muted:#a3a6b4;--green:#22c55e;--amber:#f5a524}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ink);color:#fff;
  font-family:'Segoe UI Variable Display','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
#bg,#fx,#stage,#vig,#hud,#cap,#grain{position:absolute;left:0;top:0;width:1920px;height:1080px}
#fx,#grain{pointer-events:none}
#grain{opacity:.075;mix-blend-mode:overlay}
#vig{background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6) 100%)}
.abs{position:absolute}
.glass{background:linear-gradient(155deg,rgba(255,255,255,.11),rgba(255,255,255,.025));border:1px solid var(--line);
  backdrop-filter:blur(24px) saturate(140%);border-radius:28px;
  box-shadow:0 40px 90px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.14)}
.kicker{font-weight:700;letter-spacing:.3em;font-size:24px;color:var(--hot);text-transform:uppercase}
.big{font-weight:800;letter-spacing:-.035em;line-height:.98}
.grad{background:linear-gradient(100deg,#fff 0%,#fff 40%,#ff7a7a 72%,#ef2332 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.gradg{background:linear-gradient(100deg,#fff 0%,#c9ffd9 45%,#22c55e 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.mono{font-family:'Cascadia Mono','Consolas',monospace}
.m{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .02em .1em}
.m>span{display:inline-block;will-change:transform}
.pill{display:inline-flex;align-items:center;gap:12px;border-radius:999px;padding:10px 22px;font-weight:700;font-size:24px;letter-spacing:.08em}
.shadowtxt{text-shadow:0 6px 40px rgba(0,0,0,.6)}
/* captions */
#cap{display:flex;justify-content:center;align-items:flex-end;padding-bottom:70px;pointer-events:none}
#capbox{font-weight:700;font-size:54px;letter-spacing:-.01em;text-align:center;max-width:1500px;line-height:1.2;
  text-shadow:0 4px 18px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,1)}
#capbox span{display:inline-block;margin:0 .14em;transition:none}
#capbox .w0{color:rgba(255,255,255,.42)}
#capbox .w1{color:#fff}
#capbox .on{color:#fff;background:var(--red);border-radius:12px;padding:0 .16em;margin:0 .02em;box-shadow:0 8px 30px rgba(239,35,50,.55)}
#capband{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(0deg,rgba(0,0,0,.55),rgba(0,0,0,0))}
</style></head>
<body>
<div id="bg"></div><canvas id="fx" width="1920" height="1080"></canvas><div id="stage"></div>
<div id="vig"></div><div id="hud"></div><div id="cap"><div id="capband"></div><div id="capbox"></div></div>
<canvas id="grain" width="480" height="270" style="width:1920px;height:1080px"></canvas>
<script src="timeline.js"></script>
<script>
"use strict";
const W = 1920, H = 1080, A = TL.assets;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const eo = x => { x = clamp(x); return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); };          // expo out
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const bk = x => { x = clamp(x); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }; // back out
const P = (t, a, d) => eo((t - a) / d);
const PB = (t, a, d) => bk((t - a) / d);
function el(tag, cls, css, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (css) e.style.cssText = css;
  if (html !== undefined) e.innerHTML = html;
  (parent || document.body).appendChild(e);
  return e;
}
const fmt = n => Math.round(n).toLocaleString("en-US");
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function masked(parent, text, cls, css) {   // words that rise out of a mask
  const box = el("div", cls, css, parent);
  const spans = text.split(" ").map(w => { const m = el("span", "m", "margin-right:.24em", box); el("span", "", "", m, w); return m.firstChild; });
  return { box, spans, set(t, start, gap = 0.06, d = 0.55) {
    spans.forEach((s, i) => { const p = P(t, start + i * gap, d); s.style.transform = `translateY(${(1 - p) * 110}%)`; }); } };
}
function sweep(parent, css) {  // a diagonal light sweep
  const s = el("div", "abs", "top:-20%;height:140%;width:240px;transform:skewX(-20deg);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.22),rgba(255,255,255,0));mix-blend-mode:overlay;" + (css || ""), parent);
  return (p, x0, x1) => { s.style.left = lerp(x0, x1, p) + "px"; s.style.opacity = p > 0 && p < 1 ? 1 : 0; };
}
function ring(parent, size, css) {   // score ring
  const r = size / 2 - 10, c = 2 * Math.PI * r;
  const box = el("div", "abs", `width:${size}px;height:${size}px;${css}`, parent);
  box.innerHTML = `<svg width="${size}" height="${size}" style="position:absolute;left:0;top:0;transform:rotate(-90deg)">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="rgba(255,255,255,.12)" stroke-width="12" fill="none"/>
    <circle class="arc" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}"/></svg>
    <div class="num big" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:${size * .34}px"></div>`;
  const arc = box.querySelector(".arc"), num = box.querySelector(".num");
  return (v, force) => { const col = force || (v >= 72 ? "#22c55e" : v >= 55 ? "#f5a524" : "#ef2332");
    arc.style.strokeDashoffset = c * (1 - v / 100); arc.style.stroke = col;
    arc.style.filter = `drop-shadow(0 0 12px ${col})`; num.textContent = Math.round(v); };
}
function vseek(v, t) {
  t = Math.max(0, Math.min(t, (v.duration || 1e9) - 0.05));
  if (Math.abs(v.currentTime - t) < 0.004) return Promise.resolve();
  return new Promise(r => { v.onseeked = () => r(); v.currentTime = t; });
}
function video(parent, src, css) {
  const v = el("video", "", css, parent); v.muted = true; v.preload = "auto"; v.src = src;
  READY.push(new Promise(r => { if (v.readyState >= 2) r(); else v.addEventListener("loadeddata", () => r(), { once: true }); }));
  return v;
}
function pix(canvas, src) {   // draw an image into a small canvas (shown pixelated = real feed size)
  const i = new Image(); i.src = src;
  READY.push(i.decode().then(() => canvas.getContext("2d").drawImage(i, 0, 0, canvas.width, canvas.height)).catch(() => {}));
}
function img(parent, src, css) {
  const i = el("img", "", css, parent); i.src = src;
  READY.push(i.decode().catch(() => {}));
  return i;
}
let READY = [];

/* ------------------------------------------------------------------ background, particles, grain */
const bg = document.getElementById("bg");
bg.style.background = "radial-gradient(ellipse 70% 60% at 18% 8%,rgba(150,14,28,.55),rgba(0,0,0,0) 60%),radial-gradient(ellipse 60% 55% at 90% 100%,rgba(110,10,22,.45),rgba(0,0,0,0) 60%),#050507";
const floor = el("div", "abs", "left:-480px;width:2880px;top:640px;height:900px;transform-origin:50% 0;transform:perspective(700px) rotateX(72deg);" +
  "background-image:linear-gradient(rgba(255,70,80,.22) 2px,transparent 2px),linear-gradient(90deg,rgba(255,70,80,.22) 2px,transparent 2px);" +
  "background-size:120px 120px;-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,0),#000 30%,#000 60%,rgba(0,0,0,0));opacity:.55", bg);
const beams = [0, 1, 2].map(i => el("div", "abs", `top:-400px;width:420px;height:2000px;filter:blur(60px);background:linear-gradient(180deg,rgba(239,35,50,0),rgba(239,35,50,.22),rgba(239,35,50,0));transform-origin:50% 0`, bg));
const fx = document.getElementById("fx").getContext("2d");
const R = rng(7), EMB = Array.from({ length: 70 }, () => ({ x: R() * W, y: R() * H, v: 12 + R() * 40, s: .6 + R() * 2.2, ph: R() * 6.3, a: .25 + R() * .6 }));
const gctx = document.getElementById("grain").getContext("2d");
const NOISE = Array.from({ length: 6 }, (_, k) => { const d = gctx.createImageData(480, 270), r = rng(100 + k);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } return d; });
function drawBG(t) {
  floor.style.backgroundPosition = `0 ${(t * 40) % 120}px`;
  beams.forEach((b, i) => { b.style.left = (300 + i * 620 + Math.sin(t * .2 + i * 2) * 120) + "px";
    b.style.transform = `rotate(${-24 + i * 14 + Math.sin(t * .15 + i) * 6}deg)`; b.style.opacity = .55 + .35 * Math.sin(t * .4 + i * 1.7); });
  fx.clearRect(0, 0, W, H); fx.globalCompositeOperation = "lighter";
  for (const e of EMB) {
    const y = ((e.y - t * e.v) % H + H) % H, x = e.x + Math.sin(t * .6 + e.ph) * 24;
    const g = fx.createRadialGradient(x, y, 0, x, y, e.s * 6); g.addColorStop(0, `rgba(255,120,110,${e.a})`); g.addColorStop(1, "rgba(255,40,40,0)");
    fx.fillStyle = g; fx.beginPath(); fx.arc(x, y, e.s * 6, 0, 6.283); fx.fill();
  }
  gctx.putImageData(NOISE[Math.floor(t * 24) % 6], 0, 0);
}

/* ------------------------------------------------------------------ HUD and captions */
const hud = document.getElementById("hud");
const bar = el("div", "abs", "left:0;top:0;height:5px;background:linear-gradient(90deg,#ef2332,#ff7a7a);box-shadow:0 0 18px #ef2332", hud);
const chip = el("div", "abs pill glass", "left:56px;top:44px;font-size:22px;border-radius:999px;padding:12px 22px", hud);
const capbox = document.getElementById("capbox"), capband = document.getElementById("capband");
const LINES = [];
TL.scenes.forEach(s => s.lines.forEach(l => { if (s.captions !== false) LINES.push({ s: s.start + l.s, e: s.start + l.e, words: l.words.map(w => ({ w: w.w, s: s.start + l.s + w.s, e: s.start + l.s + w.e })) }); }));
LINES.forEach(L => { // phrases of up to 6 words, broken after punctuation
  L.ph = []; let cur = [];
  L.words.forEach((w, i) => { cur.push(i); if (cur.length >= 6 || /[.,?!:;]$/.test(w.w)) { L.ph.push(cur); cur = []; } });
  if (cur.length) L.ph.push(cur);
});
let capKey = "";
function drawCaptions(t) {
  const L = LINES.find(l => t >= l.s - 0.05 && t <= l.e + 0.25);
  if (!L) { capbox.innerHTML = ""; capKey = ""; capband.style.opacity = 0; return; }
  capband.style.opacity = 1;
  let wi = 0; L.words.forEach((w, i) => { if (w.s <= t) wi = i; });
  const ph = L.ph.find(p => p.includes(wi)) || L.ph[0];
  const key = L.s + ":" + ph[0];
  if (key !== capKey) { capbox.innerHTML = ph.map(i => `<span>${L.words[i].w}</span>`).join(""); capKey = key; }
  [...capbox.children].forEach((s, k) => { const i = ph[k]; s.className = i < wi ? "w1" : i === wi ? "on" : "w0"; });
}
function drawHUD(t, sc) {
  bar.style.width = (t / TL.total * W) + "px";
  if (sc.pill) {
    chip.style.opacity = 1;
    chip.innerHTML = `<span style="color:#ff7a7a">MISTAKE ${sc.pill}</span><span style="color:rgba(255,255,255,.45)">/ 5</span>` +
      [1, 2, 3, 4, 5].map(i => `<span style="width:12px;height:12px;border-radius:6px;background:${i <= sc.pill ? "#ef2332" : "rgba(255,255,255,.2)"};box-shadow:${i === sc.pill ? "0 0 12px #ef2332" : "none"}"></span>`).join("");
  } else chip.style.opacity = 0;
}

/* ------------------------------------------------------------------ scene helpers */
function S_(sc) {
  sc.L = i => (sc.lines[i] || sc.lines[sc.lines.length - 1]).s;
  sc.E = i => (sc.lines[i] || sc.lines[sc.lines.length - 1]).e;
  sc.cue = (i, key) => { const l = sc.lines[i]; if (!l) return 0; key = key.toLowerCase();
    const w = l.words.find(w => w.w.toLowerCase().replace(/[^a-z0-9.\-']/g, "").startsWith(key)); return l.s + (w ? w.s : 0); };
  return sc;
}
function frame(parent, css, title) {  // a glass app window
  const f = el("div", "abs glass", "overflow:hidden;" + css, parent);
  const top = el("div", "abs", "left:0;right:0;top:0;height:46px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.08)", f);
  ["#ff5f57", "#febc2e", "#28c840"].forEach((c, i) => el("div", "abs", `left:${20 + i * 22}px;top:17px;width:12px;height:12px;border-radius:6px;background:${c}`, top));
  if (title) el("div", "abs mono", "left:100px;top:12px;font-size:17px;color:rgba(255,255,255,.55)", top, title);
  return f;
}
const TICK = '<svg width="34" height="34" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#22c55e"/><path d="M6.5 12.5l3.5 3.5 7.5-8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CROSS = '<svg width="34" height="34" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#ef2332"/><path d="M8 8l8 8M16 8l-8 8" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>';
const LOCK = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

/* ------------------------------------------------------------------ scenes */
const SC = {};

SC.coldopen = (root, sc) => {
  const d = sc.data;
  // beat A: the stalled-views chart
  const A1 = el("div", "abs", "left:0;top:0;width:1920px;height:1080px", root);
  const q = masked(A1, "Why do your videos stall?", "abs big shadowtxt", "left:0;right:0;top:120px;text-align:center;font-size:132px");
  const pts = []; for (let i = 0; i <= 60; i++) { const x = i / 60; const y = x < .45 ? Math.pow(x / .45, 1.6) * .8 : .8 + Math.sin(x * 40) * .012 - (x - .45) * .1; pts.push([260 + x * 1400, 820 - y * 420]); }
  const path = "M" + pts.map(p => p.map(v => v.toFixed(1)).join(",")).join(" L");
  A1.insertAdjacentHTML("beforeend", `<svg class="abs" style="left:0;top:0" width="1920" height="1080">
    <defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#ff7a7a"/><stop offset="1" stop-color="#ef2332"/></linearGradient>
    <linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="rgba(239,35,50,.35)"/><stop offset="1" stop-color="rgba(239,35,50,0)"/></linearGradient></defs>
    ${[0, 1, 2, 3].map(i => `<line x1="260" x2="1660" y1="${400 + i * 140}" y2="${400 + i * 140}" stroke="rgba(255,255,255,.07)" stroke-width="2"/>`).join("")}
    <path id="area" d="${path} L1660,820 L260,820 Z" fill="url(#fill)" opacity="0"/>
    <path id="ln" d="${path}" stroke="url(#lg)" stroke-width="7" fill="none" stroke-linecap="round" style="filter:drop-shadow(0 0 14px #ef2332)"/>
    <circle id="dot" r="12" fill="#fff" style="filter:drop-shadow(0 0 16px #ff4b4b)"/></svg>`);
  const ln = A1.querySelector("#ln"), area = A1.querySelector("#area"), dot = A1.querySelector("#dot"), len = ln.getTotalLength();
  ln.style.strokeDasharray = len;
  const flat = el("div", "abs pill", "left:1330px;top:300px;background:rgba(239,35,50,.16);border:1px solid rgba(239,35,50,.6);color:#ff8080", A1, "VIEWS: FLAT");
  // beat B: three pieces of evidence
  const B = el("div", "abs", "left:0;top:0;width:1920px;height:1080px;perspective:1800px", root);
  const cards = [0, 1, 2].map(i => el("div", "abs glass", `left:${150 + i * 560}px;top:250px;width:500px;height:400px;padding:34px;transform-style:preserve-3d`, B));
  el("div", "kicker", "font-size:20px;margin-bottom:26px", cards[0], "THUMBNAIL AT 168 PX");
  const tc = el("canvas", "", "width:420px;height:236px;image-rendering:pixelated;border-radius:10px", cards[0]); tc.width = 168; tc.height = 94;
  pix(tc, A.thumbA);
  el("div", "pill", "margin-top:22px;background:rgba(239,35,50,.18);color:#ff8080;border:1px solid rgba(239,35,50,.6)", cards[0], "CONTRAST 2.9 : 1 &nbsp;·&nbsp; FAIL");
  el("div", "kicker", "font-size:20px;margin-bottom:22px", cards[1], "OPENING LINE");
  el("div", "", "font-size:34px;font-weight:600;line-height:1.25;color:#e8e8ee", cards[1], "“Hey guys, welcome back, in this video I’ll show you some AI tips.”");
  const r1 = ring(cards[1], 130, "right:30px;bottom:26px");
  el("div", "kicker", "font-size:20px;margin-bottom:22px", cards[2], "RAW TAKE");
  const wv = el("div", "", "position:relative;height:200px;display:flex;align-items:center;gap:3px", cards[2]);
  const rr = rng(3); for (let i = 0; i < 70; i++) el("div", "", `width:3px;height:${20 + rr() * 150}px;border-radius:2px;background:${i < 22 ? "#ef2332" : "rgba(255,255,255,.75)"}`, wv);
  el("div", "abs", "left:0;top:0;width:96px;height:200px;border:2px dashed #ef2332;border-radius:10px;background:rgba(239,35,50,.12)", wv);
  el("div", "pill", "margin-top:22px;background:rgba(239,35,50,.18);color:#ff8080;border:1px solid rgba(239,35,50,.6)", cards[2], "RETAKE LEFT IN");
  const five = el("div", "abs big", "left:0;right:0;top:330px;text-align:center;font-size:250px", root, '<span class="grad">5 MISTAKES</span>');
  const fsub = el("div", "abs", "left:0;right:0;top:620px;text-align:center;font-size:44px;font-weight:600;color:rgba(255,255,255,.75)", root, "you’re probably making too");
  const sw = sweep(five);
  const tB = sc.L(1) + 0.15, t5 = sc.cue(1, "5");
  return t => {
    q.set(t, 0.15);
    const pa = P(t, 0.3, Math.max(0.8, tB - 0.6));
    ln.style.strokeDashoffset = len * (1 - pa); area.style.opacity = pa * .9;
    const pt = ln.getPointAtLength(len * pa); dot.setAttribute("cx", pt.x); dot.setAttribute("cy", pt.y);
    flat.style.opacity = P(t, tB - 0.9, .4); flat.style.transform = `scale(${lerp(.8, 1, PB(t, tB - .9, .5))})`;
    const outA = P(t, tB - 0.2, .5);
    A1.style.opacity = 1 - outA; A1.style.transform = `scale(${1 + outA * .15})`; A1.style.filter = outA > 0 ? `blur(${outA * 10}px)` : "none";
    cards.forEach((c, i) => { const p = PB(t, tB + i * .32, .7), back = P(t, t5 - .15, .6);
      c.style.opacity = clamp((t - tB - i * .32) * 3) * (1 - back * .8);
      c.style.transform = `translateZ(${-back * 500}px) rotateY(${(1 - p) * (40 - i * 40)}deg) translateY(${(1 - p) * 120}px)`;
      c.style.filter = back > 0 ? `blur(${back * 8}px)` : "none"; });
    r1(24 * P(t, tB + .6, 1));
    const p5 = P(t, t5 - .1, .6);
    five.style.opacity = p5; five.style.transform = `scale(${lerp(1.35, 1, p5)})`; five.style.filter = p5 < 1 ? `blur(${(1 - p5) * 16}px)` : "none";
    fsub.style.opacity = P(t, t5 + .5, .5); sw(clamp((t - t5 - .4) / .9), -300, 1900);
  };
};

SC.zayn = (root, sc) => {
  const v = video(root, A.zayn, "position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover");
  const lt = el("div", "abs glass", "left:80px;top:690px;width:620px;height:150px;border-radius:22px;padding:22px 32px;overflow:hidden", root);
  el("div", "abs", "left:0;top:0;bottom:0;width:10px;background:#ef2332;box-shadow:0 0 24px #ef2332", lt);
  el("div", "big", "font-size:62px", lt, "ZAYN");
  el("div", "", "font-size:26px;font-weight:600;color:rgba(255,255,255,.75);margin-top:6px", lt, "AI host &nbsp;·&nbsp; real work, no hype");
  return async t => { const p = P(t, .35, .7); lt.style.opacity = p; lt.style.transform = `translateX(${(1 - p) * -80}px)`;
    await vseek(v, t); };
};

SC.promise = (root, sc) => {
  el("div", "abs kicker", "left:0;right:0;top:120px;text-align:center", root, "BY THE END OF THIS VIDEO");
  const h = masked(root, "Fix all 5. Today.", "abs big", "left:0;right:0;top:170px;text-align:center;font-size:120px");
  const row = el("div", "abs", "left:0;top:380px;width:1920px;height:440px;perspective:1600px", root);
  const inner = el("div", "abs", "left:0;top:0;width:1920px;height:440px;transform-style:preserve-3d", row);

/* ------------------------------------------------------------------ the clock */
const stage = document.getElementById("stage");
let cur = -1, upd = null;
async function seek(t) {
  let i = TL.scenes.findIndex(s => t >= s.start && t < s.start + s.dur); if (i < 0) i = TL.scenes.length - 1;
  const sc = TL.scenes[i];
  if (i !== cur) {
    stage.innerHTML = ""; READY = [];
    const root = el("div", "abs", "left:0;top:0;width:1920px;height:1080px", stage);
    upd = SC[sc.kind](root, S_(sc)); cur = i;
    await Promise.all(READY);
  }
  const lt = t - sc.start;
  drawBG(t); drawHUD(t, sc); drawCaptions(t);
  const pi = sc.kind === "zayn" || i === 0 ? 1 : P(lt, 0, .45), po = clamp((sc.dur - lt) / .3);
  stage.style.opacity = Math.min(pi, po);
  stage.style.transform = `scale(${lerp(1.06, 1, pi) - (1 - po) * .03})`;
  stage.style.filter = pi < 1 ? `blur(${(1 - pi) * 14}px)` : "none";
  await upd(lt);
  return true;
}
window.seek = seek;
window.ready = document.fonts.ready.then(() => true);
